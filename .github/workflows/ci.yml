name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Node 24 matches the runtime the lockfiles were generated with: npm 11 writes
# lockfile metadata that npm 10 rejects, and the Firebase packages the store app
# depends on require >= 24.12.0.
env:
  NODE_VERSION: "24"

jobs:
  storefront:
    name: Storefront (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm test
      # `build` runs `tsc --noEmit` first, so this is also the typecheck.
      - run: npm run build

  web:
    name: App (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `next build` is intentionally omitted: it needs database and storage
      # credentials, so it would fail on infrastructure rather than on code.
      # Add it here once those secrets are provisioned for CI.
