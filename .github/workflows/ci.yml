name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Tienda (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Node 24 is what the lockfiles were generated with: npm 11 writes
          # metadata npm 10 rejects, and Firebase requires >= 24.12.0.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # `next build` is intentionally omitted: it needs database and storage
      # credentials, so it would fail on infrastructure rather than on code.
      # Add it here once those secrets are provisioned for CI.
